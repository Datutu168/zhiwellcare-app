# ============================================================
# 智为康乐 zhiwellcare-app · 后端一键编排
#   PostgreSQL 16 + Redis 7 + MinIO(S3 兼容) + Golang 后端
#
# 用法：
#   只起中间件（本机 go run 调试后端）：
#     docker compose up -d postgres redis minio
#   连后端服务一起起：
#     APP_JWT_SECRET=$(openssl rand -hex 32) docker compose up -d --build
#
# 注意：这是「本地开发 / 单机内网」编排，默认口令仅供开发。
#       生产请按 backend/DEPLOYMENT.md 使用托管数据库与对象存储、TLS、密钥管理，
#       并把 APP_JWT_SECRET 换成 32 字节以上的随机串。
# ============================================================
name: zhiwellcare

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zhiwellcare}
      POSTGRES_USER: ${POSTGRES_USER:-zhiwellcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhiwellcare-dev}
      # 训练采样/摘要以中文为主，统一排序与编码
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhiwellcare} -d ${POSTGRES_DB:-zhiwellcare}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 限流计数/会话吊销/设备映射与白名单缓存；AOF 持久化避免重启丢白名单缓存
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    # S3 兼容对象存储：Web 包 / 游戏资源 / 固件 / 训练采样文件
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zwkl-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zwkl-minio-dev}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ADDR: ":8080"
      APP_DB_URL: postgres://${POSTGRES_USER:-zhiwellcare}:${POSTGRES_PASSWORD:-zhiwellcare-dev}@postgres:5432/${POSTGRES_DB:-zhiwellcare}?sslmode=disable
      APP_REDIS_URL: redis://redis:6379/0
      # 生产必须替换：openssl rand -hex 32
      APP_JWT_SECRET: ${APP_JWT_SECRET:-zhiwellcare-dev-secret-change-me}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173,http://localhost:1420,http://localhost:4173}
      APP_LOG_JSON: "true"
      APP_LOG_REQUESTS: "true"
      # 对象存储：桶不存在时后端会自动创建
      APP_S3_ENDPOINT: minio:9000
      APP_S3_REGION: ${APP_S3_REGION:-us-east-1}
      APP_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-zwkl-minio}
      APP_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-zwkl-minio-dev}
      APP_S3_BUCKET: ${APP_S3_BUCKET:-zhiwellcare}
      APP_S3_USE_SSL: "false"
      # 本地模式预签名地址的对外前缀（换成真实域名/网关地址即可）
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      # 配置了 CDN 时优先下发 CDN 地址（MinIO 直连示例）
      APP_CDN_BASE: ${APP_CDN_BASE:-}
      # 首次部署时先注册该手机号，再注入本变量重启完成管理员引导（见 DEPLOYMENT.md）
      APP_ADMIN_BOOTSTRAP_PHONE: ${APP_ADMIN_BOOTSTRAP_PHONE:-}
      APP_WECHAT_APPID: ${APP_WECHAT_APPID:-}
      APP_WECHAT_SECRET: ${APP_WECHAT_SECRET:-}
      APP_DEBUG: "false"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 未配置 S3 时的本地对象存储回退目录（容器内路径与 APP_S3_LOCAL_DIR 对应）
      - objectdata:/app/storage

  # Web 静态下发 + API 反代（CDN 回源层）。
  # 先在本机执行 npm run build 生成 dist/，再 docker compose up -d web。
  # 生产可把本层换成真实 CDN（回源到同一份 dist/ 与 /api）。
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
  objectdata:

