# ============================================================
# 智为康乐 · Web 静态下发 + API 反代（CDN 回源层）
#
# 用法（docker compose 中由 web 服务挂载）：
#   ./dist                     → /usr/share/nginx/html   （先执行 npm run build）
#   deploy/nginx.conf          → /etc/nginx/conf.d/default.conf
#
# 生产建议：本层作为 CDN 的回源站，把静态资源缓存交给 CDN，
#           仅 /api/ 保持回源到后端；域名策略见 backend/DEPLOYMENT.md。
# ============================================================

# 静态资源压缩（.js/.css/.json 等文本资源体积可降约 70%）
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml
    application/wasm;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（CSP 由部署层按端配置，其余基础头与后端 SecurityHeaders 保持一致）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 后端 API 反代：与静态同域，天然规避跨域
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 训练采样直传若走本地对象存储（非 S3）会经过本层，放宽请求体上限
        client_max_body_size 64m;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # 带内容哈希的构建产物可以长期强缓存（Vite 产物文件名含 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 绝不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # SPA 路由回退：前端为 history 路由，未知路径一律回入口由前端接管
    location / {
        try_files $uri $uri/ /index.html;
    }
}
