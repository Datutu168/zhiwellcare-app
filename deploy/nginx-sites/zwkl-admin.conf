# 管理后台（独立子域名，避免与 App 的 /assets 路径冲突）
#
# 注意：后台前端（admin/）调用的是**相对路径** `/api/v1...`，
# 因此本 vhost 必须自带 /api/ 反代，否则浏览器里的登录/列表请求
# 会落到静态目录：POST → 405 Not Allowed，GET → 返回 index.html（JSON 解析失败）。
server {
    listen 80;
    listen [::]:80;
    server_name admin.zhiwellcare.cn admin.zhiwellcare.com;

    root /srv/sites/admin/current;
    index index.html;
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 后台与 API 同域，天然规避跨域（无需依赖 CORS 白名单）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        access_log off;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
